name: Publish Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Validate tag matches Android version
        shell: bash
        run: |
          version=$(python3 - <<'PY'
          import re
          text = open("app/build.gradle.kts", encoding="utf-8").read()
          print(re.search(r'versionName\s*=\s*"([^"]+)"', text).group(1))
          PY
          )
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Restore release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            test -n "${!name}"
          done
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/brush-alarm-release.jks"
      - name: Test and build signed release APK
        env:
          BRUSH_ALARM_KEYSTORE_PATH: ${{ runner.temp }}/brush-alarm-release.jks
          BRUSH_ALARM_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          BRUSH_ALARM_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          BRUSH_ALARM_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
      - name: Prepare release assets
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk "BrushAlarm-${GITHUB_REF_NAME}-android-arm64.apk"
          sha256sum "BrushAlarm-${GITHUB_REF_NAME}-android-arm64.apk" > SHA256SUMS
      - name: Verify release signature
        shell: bash
        run: |
          apksigner=$(python3 - <<'PY'
          import os
          from pathlib import Path
          candidates = list((Path(os.environ["ANDROID_HOME"]) / "build-tools").glob("*/apksigner"))
          def version(path):
              return tuple(int(part) for part in path.parent.name.split(".") if part.isdigit())
          print(max(candidates, key=version))
          PY
          )
          "$apksigner" verify --verbose --print-certs "BrushAlarm-${GITHUB_REF_NAME}-android-arm64.apk"
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "BrushAlarm-${GITHUB_REF_NAME}-android-arm64.apk" \
            SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
